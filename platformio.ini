; https://docs.platformio.org/page/projectconf.html

[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
lib_deps = 
	adafruit/Adafruit SH110X@^2.1.14
	sandeepmistry/LoRa@^0.8.0
	kokke/tiny-AES-c@0.0.0-alpha+sha.3f69a5899e
monitor_speed = 115200







